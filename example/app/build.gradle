plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sy.rtc.example'
    compileSdk 35

    defaultConfig {
        applicationId "com.sy.rtc.example"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "3.2.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

def useLocalSdk = providers.gradleProperty("useLocalSdk").orElse("false").get() == "true"
def sdkVersion = providers.gradleProperty("sdkVersion").orElse("v3.2.0").get()

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    if (useLocalSdk) {
        // 改 SDK 源码时用。客户工程不要写这一行。
        implementation project(':sy-rtc-android-sdk')
        implementation 'io.github.webrtc-sdk:android:125.6422.07'
    } else {
        // 客户接入就写这一行（版本号与 git tag 一致）。
        implementation "com.github.carlcy:sy-rtc-android-sdk:${sdkVersion}"
    }
}
