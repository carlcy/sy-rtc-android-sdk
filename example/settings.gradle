pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.application' version '8.7.3'
        id 'com.android.library' version '8.7.3'
        id 'org.jetbrains.kotlin.android' version '2.0.21'
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        // 与客户同一坐标。仓库根目录 ./gradlew publishToMavenLocal 后，本地包优先于 JitPack。
        mavenLocal()
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "SyRtcSDKExample"
include ':app'

// 源码联调：example/gradle.properties 里 useLocalSdk=true
def useLocalSdk = providers.gradleProperty("useLocalSdk").orElse("false").get() == "true"
if (useLocalSdk) {
    include ':sy-rtc-android-sdk'
    project(':sy-rtc-android-sdk').projectDir = new File(settingsDir, '..')
}
